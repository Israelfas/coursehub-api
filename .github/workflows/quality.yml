name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, pruebas y compilacion
    runs-on: ubuntu-latest

    # PostgreSQL desechable solo para las pruebas e2e: nace vacio en cada
    # ejecucion y desaparece al terminar. No es la base de ningun equipo.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coursehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valores exclusivos de CI. Ninguno es una credencial real: la base es el
    # contenedor de arriba y el secreto JWT solo firma tokens de prueba.
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: coursehub_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-only-jwt-secret-for-e2e-tests-not-used-anywhere-else
      JWT_EXPIRES_IN: 15m
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias desde package-lock.json
        run: npm ci

      - name: Analisis estatico
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Pruebas e2e contra PostgreSQL de prueba
        run: npm run test:e2e

      - name: Compilar
        run: npm run build

  dependencias:
    name: Revision de dependencias
    # Compara las dependencias que agrega una solicitud de cambio contra la
    # base de vulnerabilidades de GitHub; en un push directo no hay con que comparar.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
